services:
  - type: web
    name: train-reservation-bot
    runtime: docker
    healthCheckPath: /health
    plan: free
    branch: codex/unified-ktx-production
    autoDeployTrigger: commit
    envVars:
      - key: UNIFIED_KTX
        value: "True"
      - key: BOTTOKEN
        sync: false
      - key: USERID
        sync: false
      - key: USERPW
        sync: false
      - key: SEARCH_INTERVAL
        value: "1"
      - key: ALLOW_LIST
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_DB
        value: "1"
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "False"
      - key: PAYMENT_TIMEOUT_MINUTES
        value: "10"
      - key: PAYMENT_REMINDER_INTERVAL
        value: "120"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
